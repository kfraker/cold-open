# Runs on every push to every branch. A pull request's checks are the runs on its latest push.
# Actions are pinned to full commit SHAs, with the release tag in a comment, so a moved or
# hijacked tag can't change what runs here. Dependabot (story 0.6) keeps them current.
name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels a story branch's older run. Runs on `main` and `dev` always finish, because
# Vercel's deploy gate waits for each commit's checks, and a cancelled check would hold it forever.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

jobs:
  # Both job names are required checks in .github/rulesets/. Rename the job and the ruleset
  # together, or pull requests wait forever for a check that no longer reports.
  # This job also runs the migration tests (story 0.8), so they block a merge like everything else.
  checks:
    name: Lint, types, unit tests, licenses, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # A throwaway Postgres for the migration tests, thrown away when the job ends. No password: it
    # only listens on the runner. The same major version as Neon. Pinned by digest like the actions
    # (postgres:17-alpine as of 2026-11-09). Dependabot doesn't watch service images, so the digest
    # is updated by hand.
    services:
      postgres:
        image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
        env:
          POSTGRES_USER: ci
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: cold_open_sandbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d cold_open_sandbox"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Formatting and lint
        run: npm run lint
      - name: Type check
        run: npm run check
      - name: Migrations match the schema
        run: |
          npm run db:check
          npm run db:generate
          changes="$(git status --porcelain -- drizzle src/lib/server/db)"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::The schema changed without a migration. Run npm run db:generate and commit the new files in drizzle/."
            exit 1
          fi
      - name: Migrations apply to a throwaway database, then a second run has nothing to do
        env:
          APP_ENV: sandbox
          DATABASE_URL: postgres://ci@localhost:5432/cold_open_sandbox
        run: |
          npm run db:migrate
          npm run db:migrate | tee "$RUNNER_TEMP/second-run.txt"
          grep -q ': 0 applied now' "$RUNNER_TEMP/second-run.txt"
      - name: Browser for component tests
        run: npx playwright install --with-deps chromium
      - name: Unit tests with coverage (fails if coverage drops)
        run: npm run test:coverage
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: |
          node -e "
            const t = require('./coverage/coverage-summary.json').total;
            const rows = ['lines', 'statements', 'functions', 'branches']
              .map((k) => '| ' + k + ' | ' + t[k].pct + '% | ' + t[k].covered + ' of ' + t[k].total + ' |');
            console.log(['## Unit test coverage', '', '| | Covered | |', '|---|---|---|', ...rows].join('\n'));
          " >> "$GITHUB_STEP_SUMMARY"
      - name: Dependency licenses
        run: npm run licenses
      - name: Known vulnerabilities (fails on high or critical)
        run: npm audit --audit-level=high

  browsers:
    name: Browser tests (Chromium, Firefox, WebKit, Pixel 7, iPhone 14)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser tests with accessibility checks
        id: e2e
        run: npx playwright test
      - name: User flow coverage (fails if a covered flow loses its test)
        # Runs when the tests ran, even if some failed, but not after an earlier step failed.
        if: ${{ !cancelled() && (steps.e2e.outcome == 'success' || steps.e2e.outcome == 'failure') }}
        run: npm run flows:report
      - name: Test report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
