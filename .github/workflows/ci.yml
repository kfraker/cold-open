# Runs on every push to every branch. A pull request's checks are the runs on its latest push.
# Actions are pinned to full commit SHAs, with the release tag in a comment, so a moved or
# hijacked tag can't change what runs here. Dependabot (story 0.6) keeps them current.
name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit tests, licenses, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Formatting and lint
        run: npm run lint
      - name: Type check
        run: npm run check
      - name: Browser for component tests
        run: npx playwright install --with-deps chromium
      - name: Unit tests with coverage (fails if coverage drops)
        run: npm run test:coverage
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: |
          node -e "
            const t = require('./coverage/coverage-summary.json').total;
            const rows = ['lines', 'statements', 'functions', 'branches']
              .map((k) => '| ' + k + ' | ' + t[k].pct + '% | ' + t[k].covered + ' of ' + t[k].total + ' |');
            console.log(['## Unit test coverage', '', '| | Covered | |', '|---|---|---|', ...rows].join('\n'));
          " >> "$GITHUB_STEP_SUMMARY"
      - name: Dependency licenses
        run: npm run licenses
      - name: Known vulnerabilities (fails on high or critical)
        run: npm audit --audit-level=high

  browsers:
    name: Browser tests (Chromium, Firefox, WebKit, Pixel 7, iPhone 14)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser tests with accessibility checks
        run: npx playwright test
      - name: User flow coverage (fails if a covered flow loses its test)
        if: ${{ !cancelled() }}
        run: npm run flows:report
      - name: Test report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
