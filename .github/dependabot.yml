# Dependabot version updates (story 0.6). Pull requests go to `dev`, never straight to `main`, so
# every update passes CI and the `dev` preview before release, like any other change.
# The 14-day cooldown matches `min-release-age=14` in .npmrc: a package is only proposed once its
# new release has been public for 14 days, so a hijacked release is likely to be caught and pulled
# first. The cooldown covers the package being bumped, not other packages its lockfile update
# brings along; see docs/decisions.md.
# Security alerts still appear at once; see docs/decisions.md for how they're handled.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    # Indirect dependencies too, so fixes for advisories deep in the tree are proposed.
    allow:
      - dependency-type: all
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    # Major versions held back on purpose; see docs/decisions.md. Remove an entry when its reason ends.
    ignore:
      # Node is pinned to 24 (.nvmrc, engines), so its type definitions stay on 24 as well.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # svelte-check 4.7 supports TypeScript 5 and 6 only, so TypeScript 7 can't install yet.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
      include: scope
